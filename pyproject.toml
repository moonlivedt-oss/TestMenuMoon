# Настройки инструментов проекта. Пакетом проект не ставится: запуск — python tm.py / studio.py.

[tool.ruff]
line-length = 120
target-version = "py310"
# вендоренный декомпилятор (своя история) и рабочие папки
extend-exclude = ["unrpyc", "build", "_ta", "tools/unity"]

[tool.ruff.lint]
# только то, что ловит ошибки: неопределённые имена, лишние импорты, синтаксис, ловушки bugbear.
# Стиль (длина строк, кавычки, порядок импортов) не проверяется: код уже живёт в своём стиле.
select = ["F", "E9", "B006", "B008", "B012", "B015", "B018", "B023", "PLE"]
ignore = [
    "E741",  # имена l / I / O встречаются в коротких циклах
]

[tool.ruff.lint.per-file-ignores]
# тесты берут общие импорты и помощники из helpers.py звёздочкой
"tests/test_*.py" = ["F403", "F405"]
# данные манифеста: длинные строки и любые литералы
"tmkit/games_*.py" = ["E501"]
