<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>TEST MENU | Twine PoC — демо</title>
  <style>
    body { font-family: Segoe UI, system-ui, sans-serif; background:#12141a; color:#e8eaee;
           margin:0; padding:40px; }
    .card { max-width:560px; margin:0 auto; background:#0f1219; border:1px solid #23262f;
            border-radius:12px; padding:24px 28px; }
    h1 { color:#38e0c8; margin-top:0; }
    code { background:#0a0c11; padding:2px 6px; border-radius:5px; }
    kbd { background:#1b1f29; border:1px solid #2b2f3a; border-radius:5px; padding:2px 7px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Twine PoC — демо</h1>
    <p>Это заглушка SugarCube: <code>window.State.variables</code> с парой переменных.
       Нажми <kbd>Shift</kbd>+<kbd>T</kbd> — откроется тест-меню. Меняй значения, закрой на
       <kbd>Esc</kbd>, снова открой — увидишь применённые правки.</p>
    <p id="dump"></p>
  </div>

  <!-- заглушка SugarCube (в реальной игре это уже есть) -->
  <script>
    window.State = { variables: { money: 100, love: 5, corruption: 0, has_key: true, name: "Hero" } };
    function dump() {
      document.getElementById("dump").textContent = JSON.stringify(State.variables);
    }
    dump();
    setInterval(dump, 500);   // видно, как меню меняет переменные
  </script>

  <!-- в реальной игре inject.py склеивает адаптер + ядро в один <script>;
       здесь грузим по отдельности: сначала адаптер (задаёт TM_ADAPTER), потом ядро -->
  <script src="tm_menu.js"></script>
  <script src="../_shared/tm_menu_core.js"></script>
</body>
</html>
