# Smoke tests for the tmkit toolkit. No external deps (pure stdlib),
# so no pip install step is needed. Runs on Windows to match the dev
# environment (Windows-centric paths, .exe launcher autodetect).
name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run smoke tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python tests/run.py
